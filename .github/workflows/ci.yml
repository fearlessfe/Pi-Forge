name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/desktop/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/desktop/coverage/lcov.info
          flags: unit
          name: pi-forge-unit-tests
          fail_ci_if_error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

  performance:
    name: Performance budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PI_PERFORMANCE_OUTPUT_DIR: ${{ github.workspace }}/artifacts/performance

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Playwright Chromium
        id: performance-playwright-cache
        uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: performance-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache Electron runtime
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: performance-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium
        if: steps.performance-playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Build production renderer
        run: pnpm build

      - name: Verify bundle, Chromium trace, and React profile budgets
        run: pnpm verify:performance

      - name: Package unpacked Electron app
        run: pnpm --dir apps/desktop exec electron-builder --linux --x64 --dir --publish never

      - name: Verify packaged startup budget
        run: pnpm verify:performance:startup -- apps/desktop/release/linux-unpacked

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence-${{ github.run_attempt }}
          path: artifacts/performance
          if-no-files-found: warn
          retention-days: 14

  ui-smoke:
    name: UI and Electron smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      SHOTS_DIR: ${{ github.workspace }}/artifacts/ui-smoke/shots

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache Electron runtime
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: electron-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Prepare verification artifacts
        run: mkdir -p artifacts/ui-smoke/logs "$SHOTS_DIR"

      - name: Verify design tokens
        shell: bash
        run: |
          set -o pipefail
          pnpm verify:tokens 2>&1 | tee artifacts/ui-smoke/logs/tokens.log

      - name: Verify renderer smoke
        shell: bash
        run: |
          set -o pipefail
          pnpm verify:renderer:smoke 2>&1 | tee artifacts/ui-smoke/logs/renderer.log

      - name: Verify critical Electron IPC
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a pnpm verify:electron:smoke 2>&1 | tee artifacts/ui-smoke/logs/electron.log

      - name: Upload UI smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-failure-${{ github.run_attempt }}
          path: artifacts/ui-smoke
          if-no-files-found: warn
          retention-days: 14
