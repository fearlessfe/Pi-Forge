name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.10.0
  PNPM_VERSION: 10.17.0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  quality:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use SemVer and start with v (for example, v1.2.3 or v1.2.3-beta.1)."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build ${{ matrix.name }} package
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            artifact: linux-x64
            validation_mode: linux-x64
            runner: ubuntu-24.04
            builder_flag: --linux --x64
            subject_extension: AppImage
            secondary_subject_extension: deb
          - name: Windows x64
            artifact: windows-x64
            validation_mode: win-x64
            runner: windows-2025
            builder_flag: --win --x64
            subject_extension: exe
            secondary_subject_extension: ""
          - name: macOS Intel
            artifact: macos-x64
            validation_mode: mac-x64
            runner: macos-15-intel
            builder_flag: --mac --x64
            subject_extension: dmg
            secondary_subject_extension: zip
          - name: macOS Apple Silicon
            artifact: macos-arm64
            validation_mode: mac-arm64
            runner: macos-15
            builder_flag: --mac --arm64
            subject_extension: dmg
            secondary_subject_extension: zip
          - name: macOS Universal Update
            artifact: macos-universal
            validation_mode: mac-universal
            runner: macos-15
            builder_flag: --mac zip --universal
            subject_extension: zip
            secondary_subject_extension: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version from tag
        shell: bash
        run: echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Validate protected signing secrets
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZATION_KEY_B64: ${{ secrets.MACOS_NOTARIZATION_KEY_B64 }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            for required in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_NOTARIZATION_KEY_B64 APPLE_API_KEY_ID_SECRET APPLE_API_ISSUER_SECRET; do
              if [[ -z "${!required}" ]]; then echo "Missing protected macOS release secret: $required"; exit 1; fi
            done
            api_key_file="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
            printf '%s' "$MACOS_NOTARIZATION_KEY_B64" | base64 -D > "$api_key_file"
            chmod 600 "$api_key_file"
            echo "APPLE_API_KEY=$api_key_file" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ -z "$WINDOWS_CERTIFICATE_PFX" || -z "$WINDOWS_CERTIFICATE_PASSWORD" || -z "$WINDOWS_PUBLISHER_NAME" ]]; then
              echo "Missing protected Windows Authenticode certificate secret."
              exit 1
            fi
          fi

      - name: Build application
        run: pnpm build

      - name: Verify upgrade snapshot and rollback restore
        run: pnpm --dir apps/desktop verify:update-snapshot

      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        run: |
          package_attempt=1
          max_package_attempts=3
          signing_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            signing_args+=("--config.mac.forceCodeSigning=true")
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            signing_args+=("--config.win.forceCodeSigning=true" "--config.win.signtoolOptions.publisherName=$WINDOWS_PUBLISHER_NAME")
          fi

          while true; do
            if pnpm exec electron-builder ${{ matrix.builder_flag }} --publish never --config.extraMetadata.version="$APP_VERSION" "${signing_args[@]}"; then
              break
            fi

            if [[ "$RUNNER_OS" != "macOS" || "$package_attempt" -ge "$max_package_attempts" ]]; then
              exit 1
            fi

            echo "::warning::macOS packaging attempt $package_attempt failed; detaching stale Pi Forge volumes before retrying."
            for release_volume in "/Volumes/Pi Forge $APP_VERSION"*; do
              if [[ -e "$release_volume" ]]; then
                hdiutil detach -force "$release_volume" || true
              fi
            done

            package_attempt=$((package_attempt + 1))
            sleep 10
          done
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_P12 || runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PFX || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PFX || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'Linux' && 'false' || 'true' }}

      - name: Retain only signed update metadata
        working-directory: apps/desktop
        shell: bash
        run: node scripts/prepare-update-assets.mjs ${{ matrix.validation_mode }} "$APP_VERSION" release

      - name: Verify exact release artifact set
        working-directory: apps/desktop
        shell: bash
        run: node scripts/verify-release-assets.mjs ${{ matrix.validation_mode }} "$APP_VERSION" release

      - name: Configure Linux Chromium sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root apps/desktop/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 apps/desktop/release/linux-unpacked/chrome-sandbox

      - name: Smoke test packaged application
        working-directory: apps/desktop
        shell: bash
        run: node scripts/smoke-packaged.mjs release

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: node scripts/verify-macos-signature.mjs release

      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: ./scripts/verify-windows-signature.ps1 release "${{ secrets.WINDOWS_PUBLISHER_NAME }}"

      - name: Generate and validate packaged SBOM
        working-directory: apps/desktop
        shell: bash
        run: |
          node scripts/generate-release-sbom.mjs ${{ matrix.validation_mode }} "$APP_VERSION" release
          node scripts/verify-release-sbom.mjs ${{ matrix.validation_mode }} "$APP_VERSION" release

      - name: Attest package provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: apps/desktop/release/Pi-Forge-${{ env.APP_VERSION }}-${{ matrix.validation_mode }}.${{ matrix.subject_extension }}

      - name: Attest secondary package provenance
        if: matrix.secondary_subject_extension != ''
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: apps/desktop/release/Pi-Forge-${{ env.APP_VERSION }}-${{ matrix.validation_mode }}.${{ matrix.secondary_subject_extension }}

      - name: Attest packaged SBOM
        uses: actions/attest-sbom@10926c72720ffc3f7b666661c8e55b1344e2a365 # v2
        with:
          subject-path: apps/desktop/release/Pi-Forge-${{ env.APP_VERSION }}-${{ matrix.validation_mode }}.${{ matrix.subject_extension }}
          sbom-path: apps/desktop/release/Pi-Forge-${{ env.APP_VERSION }}-${{ matrix.validation_mode }}.sbom.cdx.json

      - name: Attest SBOM to secondary package
        if: matrix.secondary_subject_extension != ''
        uses: actions/attest-sbom@10926c72720ffc3f7b666661c8e55b1344e2a365 # v2
        with:
          subject-path: apps/desktop/release/Pi-Forge-${{ env.APP_VERSION }}-${{ matrix.validation_mode }}.${{ matrix.secondary_subject_extension }}
          sbom-path: apps/desktop/release/Pi-Forge-${{ env.APP_VERSION }}-${{ matrix.validation_mode }}.sbom.cdx.json

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-forge-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Read version from tag
        shell: bash
        run: echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pi-forge-*
          path: release-assets
          merge-multiple: true

      - name: Verify merged release and generate checksums
        shell: bash
        run: |
          node apps/desktop/scripts/verify-release-assets.mjs all "$APP_VERSION" release-assets
          for mode in linux-x64 win-x64 mac-x64 mac-arm64 mac-universal; do
            node apps/desktop/scripts/verify-release-sbom.mjs "$mode" "$APP_VERSION" release-assets
          done

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          draft: true
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Re-download and verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p remote-release-assets
          gh release download "$RELEASE_TAG" --dir remote-release-assets
          node apps/desktop/scripts/verify-release-assets.mjs all "$APP_VERSION" remote-release-assets
          cmp release-assets/SHA256SUMS remote-release-assets/SHA256SUMS

      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
