name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.10.0
  PNPM_VERSION: 10.17.0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  quality:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use SemVer and start with v (for example, v1.2.3 or v1.2.3-beta.1)."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build ${{ matrix.name }} package
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            artifact: linux-x64
            validation_mode: linux-x64
            runner: ubuntu-24.04
            builder_flag: --linux --x64
          - name: Windows x64
            artifact: windows-x64
            validation_mode: win-x64
            runner: windows-2025
            builder_flag: --win --x64
          - name: macOS Intel
            artifact: macos-x64
            validation_mode: mac-x64
            runner: macos-15-intel
            builder_flag: --mac --x64
          - name: macOS Apple Silicon
            artifact: macos-arm64
            validation_mode: mac-arm64
            runner: macos-15
            builder_flag: --mac --arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version from tag
        shell: bash
        run: echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build application
        run: pnpm build

      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        run: |
          package_attempt=1
          max_package_attempts=3

          while true; do
            if pnpm exec electron-builder ${{ matrix.builder_flag }} --publish never --config.extraMetadata.version="$APP_VERSION"; then
              break
            fi

            if [[ "$RUNNER_OS" != "macOS" || "$package_attempt" -ge "$max_package_attempts" ]]; then
              exit 1
            fi

            echo "::warning::macOS packaging attempt $package_attempt failed; detaching stale Pi Forge volumes before retrying."
            for release_volume in "/Volumes/Pi Forge $APP_VERSION"*; do
              if [[ -e "$release_volume" ]]; then
                hdiutil detach -force "$release_volume" || true
              fi
            done

            package_attempt=$((package_attempt + 1))
            sleep 10
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify exact release artifact set
        working-directory: apps/desktop
        shell: bash
        run: node scripts/verify-release-assets.mjs ${{ matrix.validation_mode }} "$APP_VERSION" release

      - name: Smoke test packaged application
        working-directory: apps/desktop
        shell: bash
        run: node scripts/smoke-packaged.mjs release

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: pi-forge-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Read version from tag
        shell: bash
        run: echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: pi-forge-*
          path: release-assets
          merge-multiple: true

      - name: Verify merged release and generate checksums
        run: node apps/desktop/scripts/verify-release-assets.mjs all "$APP_VERSION" release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: true
